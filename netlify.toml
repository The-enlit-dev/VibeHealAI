# Netlify configuration for the public website ONLY.
# This file does not deploy anything. Connecting the repository to Netlify is an owner decision.
#
# website/ is generated from site/ by `npm run build:site` and committed, so Netlify needs no build
# step. On Netlify, the waitlist form submits to Netlify Forms (form "waitlist"); form detection must be
# enabled once in the Netlify UI (Forms > Enable form detection). The local waitlist service and its
# admin dashboard (waitlist/) are NOT deployed here, and /admin/ does not exist on Netlify.
# The desktop app and the local backend are never published by this configuration.

[build]
  publish = "website"
  command = ""

# The same repository also builds an older Netlify project (brixoai.netlify.app). Send its visitors
# and search engines to the canonical site so the two copies do not compete in search results.
# On the vibehealai project this rule never matches. Deploy previews are unaffected.
[[redirects]]
  from = "https://brixoai.netlify.app/*"
  to = "https://vibehealai.netlify.app/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; form-action 'self'; base-uri 'none'; frame-ancestors 'none'"
